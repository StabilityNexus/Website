name: Scorecard supply-chain security

# ⚠️ API INTEGRITY RULES (enforced when publish_results: true):
#   - NO top-level `env:` or `defaults:` blocks in this file
#   - NO workflow-level write permissions
#   - ONLY this job may use id-token: write
# Violating any of these causes the publish step to be REJECTED by api.scorecard.dev

on:
  branch_protection_rule:

  schedule:
    - cron: '23 8 * * 6'

  push:
    # Branch-Protection check ONLY works on the default branch (Must match your actual default branch).
    branches: ["main"]

  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    if: |
      !github.event.repository.fork &&
      (github.event.repository.default_branch == github.ref_name ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request')

    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo-and-containers: false
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            index.docker.io:443
            api.osv.dev:443
            api.scorecard.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            sigstore-tuf-root.storage.googleapis.com:443
            oauth2.sigstore.dev:443

      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b163090775822d60b83c065c9b5 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@6f51ac03b935663623433d4047a81626f6f1473e # v4.5.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@df5a14028f149a7730e2c2f18f382120095b8787 # v3.26.2
        with:
          sarif_file: results.sarif
